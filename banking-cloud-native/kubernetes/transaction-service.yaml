---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: banking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
    spec:
      containers:
      - name: transaction-service
        image: banking-cloud-native-transaction-service:v3
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8083
        env:
        - name: HOSTNAME_OVERRIDE
          value: "transaction-service"
        - name: EUREKA_URI
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: EUREKA_URI
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres-transaction:5432/transactiondb"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: DB_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: DB_PASSWORD
        - name: DB_DRIVER
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: DB_DRIVER
        - name: HIBERNATE_DIALECT
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: HIBERNATE_DIALECT
        - name: SPRING_RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: SPRING_RABBITMQ_HOST
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8083
          initialDelaySeconds: 45
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8083
          initialDelaySeconds: 90
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: banking
spec:
  selector:
    app: transaction-service
  ports:
  - port: 8083
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: transaction-service-hpa
  namespace: banking
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: transaction-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
