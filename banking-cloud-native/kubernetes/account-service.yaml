---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: banking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
    spec:
      containers:
      - name: account-service
        image: banking-cloud-native-account-service:v3
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
        env:
        - name: HOSTNAME_OVERRIDE
          value: "account-service"
        - name: EUREKA_URI
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: EUREKA_URI
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres-account:5432/accountdb"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: DB_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: DB_PASSWORD
        - name: DB_DRIVER
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: DB_DRIVER
        - name: HIBERNATE_DIALECT
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: HIBERNATE_DIALECT
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          initialDelaySeconds: 45
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          initialDelaySeconds: 90
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
  namespace: banking
spec:
  selector:
    app: account-service
  ports:
  - port: 8082
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: account-service-hpa
  namespace: banking
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: account-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
