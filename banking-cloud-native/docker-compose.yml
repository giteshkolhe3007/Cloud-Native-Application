services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - banking-network

  postgres-user:
    image: postgres:15
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking123
    ports:
      - "5433:5432"
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    networks:
      - banking-network

  postgres-account:
    image: postgres:15
    environment:
      POSTGRES_DB: accountdb
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking123
    ports:
      - "5434:5432"
    volumes:
      - postgres-account-data:/var/lib/postgresql/data
    networks:
      - banking-network

  postgres-transaction:
    image: postgres:15
    environment:
      POSTGRES_DB: transactiondb
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking123
    ports:
      - "5435:5432"
    volumes:
      - postgres-transaction-data:/var/lib/postgresql/data
    networks:
      - banking-network

  postgres-notification:
    image: postgres:15
    environment:
      POSTGRES_DB: notificationdb
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking123
    ports:
      - "5436:5432"
    volumes:
      - postgres-notification-data:/var/lib/postgresql/data
    networks:
      - banking-network

  eureka-server:
    build: ./eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - banking-network

  api-gateway:
    build: ./api-gateway
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
    ports:
      - "8080:8080"
    networks:
      - banking-network

  user-service:
    build: ./user-service
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-user:
        condition: service_started
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/userdb
      SPRING_DATASOURCE_USERNAME: banking
      SPRING_DATASOURCE_PASSWORD: banking123
      DB_DRIVER: org.postgresql.Driver
      HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
    ports:
      - "8081:8081"
    networks:
      - banking-network

  account-service:
    build: ./account-service
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-account:
        condition: service_started
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-account:5432/accountdb
      SPRING_DATASOURCE_USERNAME: banking
      SPRING_DATASOURCE_PASSWORD: banking123
      DB_DRIVER: org.postgresql.Driver
      HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
    ports:
      - "8082:8082"
    networks:
      - banking-network

  transaction-service:
    build: ./transaction-service
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-transaction:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-transaction:5432/transactiondb
      SPRING_DATASOURCE_USERNAME: banking
      SPRING_DATASOURCE_PASSWORD: banking123
      SPRING_RABBITMQ_HOST: rabbitmq
      DB_DRIVER: org.postgresql.Driver
      HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
    ports:
      - "8083:8083"
    networks:
      - banking-network

  notification-service:
    build: ./notification-service
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-notification:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-notification:5432/notificationdb
      SPRING_DATASOURCE_USERNAME: banking
      SPRING_DATASOURCE_PASSWORD: banking123
      SPRING_RABBITMQ_HOST: rabbitmq
      DB_DRIVER: org.postgresql.Driver
      HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
    ports:
      - "8084:8084"
    networks:
      - banking-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - banking-network
    depends_on:
      - eureka-server

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - banking-network
    depends_on:
      - prometheus

networks:
  banking-network:
    driver: bridge

volumes:
  postgres-user-data:
  postgres-account-data:
  postgres-transaction-data:
  postgres-notification-data:
  grafana-data:
