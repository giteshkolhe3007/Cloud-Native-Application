# ==========================================
# Application Configuration
# ==========================================

# Server will run on port 8080 (default)
server.port=8080

# ==========================================
# H2 In-Memory Database Configuration
# ==========================================

# The JDBC URL for an in-memory H2 database named "bankdb"
spring.datasource.url=jdbc:h2:mem:bankdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console lets you inspect the database in a browser at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# JPA / Hibernate Configuration
# ==========================================

# "update" means Hibernate will auto-create/update tables based on our entity classes
spring.jpa.hibernate.ddl-auto=update

# Show the SQL queries Hibernate runs (helpful for learning/debugging)
spring.jpa.show-sql=true

# Dialect tells Hibernate which SQL flavor to use
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
